<!doctype html>
<html lang="ru" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <title>Панель маркетплейсов</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/app.css" />
  <link rel="stylesheet" href="/assets/css/shell.css" />
</head>
<body>
  <!-- Экран входа: показывается, только если задан пароль панели -->
  <div class="gate" id="gate" hidden>
    <form class="gate__card" id="gate-form">
      <div class="gate__mark" aria-hidden="true"></div>
      <h1 class="gate__title">Панель маркетплейсов</h1>
      <p class="gate__hint">Введите пароль доступа</p>
      <input class="gate__input" id="gate-password" type="password" autocomplete="current-password"
             placeholder="Пароль" required />
      <p class="gate__error" id="gate-error" hidden></p>
      <button class="btn btn--primary btn--wide" type="submit">Войти</button>
    </form>
  </div>

  <div class="shell" id="shell" hidden>
    <!-- Слева: куда пойти -->
    <aside class="shell__side">
      <div class="shell__brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="shell__name">Маркетплейсы</span>
      </div>
      <nav class="nav" id="sidebar" aria-label="Разделы панели"></nav>
      <div class="shell__side-foot">
        <button class="icon-btn" id="btn-theme" type="button" title="Тема оформления"
                aria-label="Тема оформления">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-moon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </aside>

    <!-- Затемнение под выдвижной навигацией на узком экране -->
    <div class="shell__backdrop" id="drawer-backdrop" aria-hidden="true"></div>

    <div class="shell__main">
      <!-- Сверху: в каком контексте я нахожусь -->
      <header class="shell__context">
        <button class="icon-btn shell__menu" id="btn-menu" type="button"
                title="Разделы" aria-label="Разделы">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="context" id="context"></div>
      </header>

      <!-- В середине: что происходит -->
      <div class="shell__outlet" id="outlet" aria-live="polite"></div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="/assets/js/format.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/menu.js"></script>
  <script src="/assets/js/router.js"></script>
  <script src="/assets/js/scope.js"></script>
  <script src="/assets/js/sidebar.js"></script>
  <script src="/assets/js/topbar.js"></script>
  <script src="/assets/js/palette.js"></script>
  <script src="/assets/js/shell.js"></script>

  <script src="/assets/js/charts.js"></script>
  <script src="/assets/js/blocks.js"></script>
  <script src="/assets/js/keys.js"></script>
  <script src="/assets/js/reply.js"></script>
  <script src="/assets/js/inbox.js"></script>
  <script src="/assets/js/tasks.js"></script>
  <script src="/assets/js/products.js"></script>
  <script src="/assets/js/knowledge.js"></script>
  <script src="/assets/js/dashboard.js"></script>
  <script src="/assets/js/sections.js"></script>
</body>
</html>
