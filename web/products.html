<!doctype html>
<html lang="ru" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <title>Товары — панель маркетплейсов</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/app.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <!-- Вход: тот же пароль, что и у основной панели -->
  <div class="gate" id="gate" hidden>
    <form class="gate__card" id="gate-form">
      <div class="gate__mark" aria-hidden="true"></div>
      <h1 class="gate__title">Товары</h1>
      <p class="gate__hint">Введите пароль доступа</p>
      <input class="gate__input" id="gate-password" type="password" autocomplete="current-password"
             placeholder="Пароль" required />
      <p class="gate__error" id="gate-error" hidden></p>
      <button class="btn btn--primary btn--wide" type="submit">Войти</button>
    </form>
  </div>

  <div class="page" id="page" hidden>
    <header class="page__head">
      <div class="page__inner">
        <div class="topbar__brand">
          <span class="brand__mark" aria-hidden="true"></span>
          <div class="brand__text">
            <span class="brand__title">Товары</span>
            <span class="brand__sub">каталог и карточки на площадке</span>
          </div>
        </div>

        <div class="topbar__actions">
          <button class="icon-btn" id="btn-reload" type="button" title="Обновить"
                  aria-label="Обновить">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
          </button>
          <button class="icon-btn" id="btn-theme" type="button" title="Тема оформления"
                  aria-label="Тема оформления">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-moon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
          <a class="btn btn--ghost" href="/knowledge" id="btn-knowledge">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM8 7h7M8 11h7"/></svg>
            <span>Справочник ответов</span>
          </a>
          <a class="btn btn--ghost" href="/tasks" id="btn-back">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h7V4H3zM14 20h7v-8h-7zM14 9h7V4h-7zM3 20h7v-5H3z"/></svg>
            <span>К задачам</span>
          </a>
        </div>
      </div>
    </header>

    <main class="page__body" id="products-body" aria-live="polite"></main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="/assets/js/format.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/products.js"></script>
  <script src="/assets/js/products-page.js"></script>
</body>
</html>
