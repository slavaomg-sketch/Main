name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: techmatch
          POSTGRES_PASSWORD: techmatch
          POSTGRES_DB: techmatch
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U techmatch" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://techmatch:techmatch@localhost:5432/techmatch?schema=public
      TEST_DATABASE_URL: postgresql://techmatch:techmatch@localhost:5432/techmatch_test?schema=public
      SESSION_SECRET: ci-session-secret-ci-session-secret
      CART_COOKIE_SECRET: ci-cart-secret-ci-cart-secret-123
      PAYMENT_WEBHOOK_SECRET: ci-webhook-secret
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: psql "postgresql://techmatch:techmatch@localhost:5432/techmatch" -c "CREATE DATABASE techmatch_test"
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @techmatch/domain --filter @techmatch/integrations test
      - run: pnpm db:seed
      - run: pnpm build
      - name: E2E
        run: |
          pnpm --filter @techmatch/web exec playwright install --with-deps chromium
          pnpm --filter @techmatch/web exec playwright test --project=desktop --project=mobile
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
