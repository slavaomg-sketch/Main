# Конфигурация для Amvera Cloud (docs.amvera.ru).
# Сборка идёт по Dockerfile из корня репозитория — он по умолчанию
# запускает бота-хаб.
meta:
  environment: docker

run:
  # Постоянное хранилище: список поездок и открытые ветки переживут
  # перезапуск и обновление приложения.
  persistenceMount: /data
